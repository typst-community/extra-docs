name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * 6"
      # At 04:05 on Saturday (UTC)
      # https://crontab.guru/#5_4_*_*_6

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # Required by `just check-versions` (which runs a `*.ts` file)
      - uses: taiki-e/install-action@v2.82.2
        with:
          tool: just, mdbook
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: typst-extra-docs
      - name: Install mdbook-typst-highlight (unreleased version)
        run: |
          cargo install --git https://github.com/sitandr/mdbook-typst-highlight --branch main
      # The following two steps are unnecessary, but help with debugging.
      - name: Build the preprocessor
        run: |
          cargo build --release --manifest-path ./typst-extra-docs/Cargo.toml
          ln -s ./typst-extra-docs/target/release/typst-extra-docs ./mdbook-typst-extra-docs
      - uses: actions/upload-artifact@v7
        with:
          name: mdbook-typst-extra-docs
          path: ./mdbook-typst-extra-docs

      - run: just build
      - name: Check versions
        shell: bash
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ALLOW_EDIT_BOOK_TOML=1 just check-versions | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rerun `just build` in case the versions changed
        shell: bash
        run: |
          set -euxo pipefail
          git clean -X --force src # Remove files ignored by git
          just build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
